<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3D2E"/>
      <stop offset="100%" stop-color="#146B50"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#gBg)"/>

  <!-- Subtle inner ring -->
  <rect x="52" y="52" width="408" height="408" rx="80" ry="80" fill="none" stroke="rgba(245,230,163,0.15)" stroke-width="3"/>

  <!-- Growth bars (chart) -->
  <rect x="120" y="280" width="48" height="100" rx="10" fill="url(#gGreen)" opacity="0.9"/>
  <rect x="188" y="230" width="48" height="150" rx="10" fill="url(#gGreen)"/>
  <rect x="256" y="170" width="48" height="210" rx="10" fill="url(#gGold)"/>

  <!-- Upward arrow / trend line -->
  <path d="M 110 300 L 180 250 L 250 200 L 340 120" fill="none" stroke="#F5E6A3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow head -->
  <path d="M 310 115 L 350 105 L 330 145 Z" fill="#F5E6A3"/>

  <!-- Coin / wealth circle accent -->
  <circle cx="380" cy="320" r="52" fill="url(#gGold)" filter="url(#glow)"/>
  <circle cx="380" cy="320" r="40" fill="none" stroke="#0B3D2E" stroke-width="4"/>
  <text x="380" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#0B3D2E">$</text>

  <!-- Small sparkles -->
  <circle cx="150" cy="140" r="6" fill="#FBBF24" opacity="0.9"/>
  <circle cx="400" cy="160" r="4" fill="#34D399" opacity="0.8"/>
  <circle cx="100" cy="200" r="3" fill="#F5E6A3" opacity="0.7"/>
</svg>